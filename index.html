<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Гүлнұр - Qyz Uzatu</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Playfair+Display:ital,wght@0,600;1,500;1,600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7a3238;
      --gold: #b38e5d;
      --text: #4a3f3a;
      --text-light: #6e6259;
      --border: #e6ded5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      /* Минимальное затемнение (0.15), чтобы фоновая картинка была максимально яркой */
      background: linear-gradient(rgba(247, 243, 237, 0.15), rgba(247, 243, 237, 0.15)), 
                  url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Экран приветствия */
    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f7f3ed;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .welcome-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .open-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 16px 36px;
      border-radius: 30px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(122, 50, 56, 0.3);
      margin-top: 25px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 20px 15px 40px;
      position: relative;
    }

    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--gold);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      font-size: 20px;
    }

    .music-btn.playing {
      animation: spin 4s linear infinite;
      background: var(--primary);
      color: #fff;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .card {
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(5px);
      margin-bottom: 22px;
      padding: 30px 22px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .flower-dec {
      font-size: 22px;
      color: var(--gold);
      margin-bottom: 10px;
      letter-spacing: 3px;
    }

    .main-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 54px;
      color: var(--primary);
      line-height: 1.1;
      margin-top: 5px;
    }

    .subtitle {
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 6px;
      font-size: 13px;
      color: var(--gold);
      text-transform: uppercase;
      margin-top: 5px;
      margin-bottom: 20px;
    }

    .invitation-text {
      font-size: 19px;
      line-height: 1.7;
      color: var(--text);
      margin: 15px 0;
    }

    .bride-name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 48px;
      color: var(--primary);
      margin: 5px 0;
    }

    .sec-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 36px;
      color: var(--primary);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .event-date {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .calendar {
      width: 100%;
      max-width: 300px;
      margin: 0 auto 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
    }

    .cal-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }

    .cal-body {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px 0;
      color: var(--text-light);
    }

    .cal-day {
      padding: 5px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-day.active {
      background-color: var(--primary);
      color: #fff;
      border-radius: 50%;
      font-weight: bold;
      width: 28px;
      height: 28px;
      margin: 0 auto;
    }
